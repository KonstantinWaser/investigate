[project]
name = "investigate"
version = "0.1.0"
description = "A personal research desk: hand it things to look into, get cited reports."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3.0",
    "tomlkit>=0.15.3",
    "yt-dlp>=2026.11.23",
]

[project.urls]
Repository = "https://github.com/KonstantinWaser/investigate"

[project.scripts]
investigate = "investigate.cli:main"

[project.gui-scripts]
investigate-tray = "investigate.cli:tray_main"

[project.optional-dependencies]
tray = [
    "pillow>=13.0.0",
    "pynput>=1.8.2 ; sys_platform != 'win32'",
    "pystray>=0.19.5",
    "winotify>=1.1.0 ; sys_platform == 'win32'",
]
instagram = [
    "playwright>=1.49",
]
transcribe = [
    "faster-whisper>=1.2.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investigate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
